name: Build NITRAM Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract and validate NITRAM source package
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "NITRAM_SUPERMARKET_GITHUB_WINDOWS_BUILD_KIT.zip"
          if (-not (Test-Path $archive)) {
            throw "Build kit ZIP was not found in the repository root."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:GITHUB_WORKSPACE -Force
          $project = Join-Path $env:GITHUB_WORKSPACE "NITRAM_TAURI_SQLITE_PROJECT"
          if (-not (Test-Path (Join-Path $project "src-tauri/Cargo.toml"))) {
            throw "The extracted Tauri project is incomplete: src-tauri/Cargo.toml is missing."
          }
          if (-not (Test-Path (Join-Path $project "dist/index.html"))) {
            throw "The extracted frontend is incomplete: dist/index.html is missing."
          }

      - name: Repair malformed newline in desktop storage bridge
        shell: pwsh
        run: |
          $htmlPath = Join-Path $env:GITHUB_WORKSPACE "NITRAM_TAURI_SQLITE_PROJECT/dist/index.html"
          $html = Get-Content -LiteralPath $htmlPath -Raw
          $bad = '},\n      reset(){request(''DELETE'',''/state'');},'
          $good = "},`n      reset(){request('DELETE','/state');},"
          if ($html.Contains($bad)) {
            $html = $html.Replace($bad, $good)
            Set-Content -LiteralPath $htmlPath -Value $html -NoNewline -Encoding utf8
          }
          if ($html.Contains('},\n      reset()')) {
            throw "Storage bridge still contains an invalid escaped newline."
          }

      - name: Repair POS navigation and move backup controls into Products
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE "NITRAM_TAURI_SQLITE_PROJECT"
          $htmlPath = Join-Path $project "dist/index.html"
          $html = Get-Content -LiteralPath $htmlPath -Raw
          $html = [regex]::Replace($html, '(?s)\s*// Simple full-state backup/import for migration and recovery\..*?(?=\s*// Verify server and database before exposing the POS UI\.)', "`n")
          if ($html.Contains('nitram-export') -or $html.Contains('nitram-import')) { throw "Floating backup controls were not removed." }
          Set-Content -LiteralPath $htmlPath -Value $html -NoNewline -Encoding utf8

          $appPath = Join-Path $project "dist/app.js"
          $app = Get-Content -LiteralPath $appPath -Raw
          $oldButton = '<button class=btn onclick="productForm()">+ Add Product</button>'
          $newButtons = '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class=ghost onclick="exportPosData()">Export Backup</button><button class=ghost onclick="document.getElementById(''restoreFile'').click()">Import Backup</button><input id=restoreFile type=file accept="application/json,.json" style="display:none" onchange="restorePosData(event)"><button class=btn onclick="productForm()">+ Add Product</button></div>'
          if (-not $app.Contains($oldButton)) { throw "Products action button was not found; refusing to alter the POS." }
          $app = $app.Replace($oldButton, $newButtons)
          Set-Content -LiteralPath $appPath -Value $app -NoNewline -Encoding utf8

          $configPath = Join-Path $project "src-tauri/tauri.conf.json"
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          if ($config.app.security) { $config.app.security.PSObject.Properties.Remove('csp') }
          $config | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $configPath -Encoding utf8
          Write-Host "Patched desktop event-handler policy and moved backup controls to Products."
      - name: Repair Rust storage bridge compile errors
        shell: pwsh
        run: |
          $mainPath = Join-Path $env:GITHUB_WORKSPACE "NITRAM_TAURI_SQLITE_PROJECT/src-tauri/src/main.rs"
          $source = Get-Content -LiteralPath $mainPath -Raw
          $oldHeaders = 'let _=req.respond(Response::from_string(body).with_status_code(code).with_headers(headers.drain(..)));'
          $newHeaders = 'let response = headers.into_iter().fold(Response::from_string(body).with_status_code(code), |r,h| r.with_header(h)); let _=req.respond(response);'
          if ($source.Contains($oldHeaders)) {
            $source = $source.Replace($oldHeaders, $newHeaders)
          }
          $badJson = '"{\\"ok\\":true}"'
          $goodJson = 'r#"{"ok":true}"#'
          if ($source.Contains($badJson)) {
            $source = $source.Replace($badJson, $goodJson)
          }
          if ($source.Contains('.with_headers(') -or $source.Contains('"{\\"ok\\":true}"')) {
            throw "Rust storage bridge compile repair did not apply."
          }
          Set-Content -LiteralPath $mainPath -Value $source -NoNewline -Encoding utf8

      - name: Apply receipt, barcode and responsiveness fixes
        shell: pwsh
        run: .github/patches/apply-runtime-fixes.ps1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked

      - name: Correct Windows raw printer API declarations
        shell: pwsh
        run: |
          $mainPath = Join-Path $env:GITHUB_WORKSPACE "NITRAM_TAURI_SQLITE_PROJECT/src-tauri/src/main.rs"
          $source = Get-Content -LiteralPath $mainPath -Raw
          $replacement = @'
#[tauri::command]
fn print_receipt(text:String)->Result<String,String>{
 #[cfg(windows)] {
  use std::{ffi::c_void,ptr::null_mut};
  type PrinterHandle=*mut c_void;
  #[repr(C)] struct DocInfo1W { pDocName:*mut u16, pOutputFile:*mut u16, pDatatype:*mut u16 }
  #[link(name="winspool.drv")]
  unsafe extern "system" {
   fn GetDefaultPrinterW(name:*mut u16, needed:*mut u32)->i32;
   fn OpenPrinterW(name:*const u16, handle:*mut PrinterHandle, defaults:*mut c_void)->i32;
   fn ClosePrinter(handle:PrinterHandle)->i32;
   fn StartDocPrinterW(handle:PrinterHandle, level:u32, info:*const c_void)->u32;
   fn StartPagePrinter(handle:PrinterHandle)->i32;
   fn WritePrinter(handle:PrinterHandle, buffer:*const c_void, count:u32, written:*mut u32)->i32;
   fn EndPagePrinter(handle:PrinterHandle)->i32;
   fn EndDocPrinter(handle:PrinterHandle)->i32;
  }
  let mut needed=0u32;unsafe{GetDefaultPrinterW(null_mut(),&mut needed);}
  if needed==0{return Err("No default Windows printer is configured. Set POS80 Printer as default.".into())}
  let mut name=vec![0u16;needed as usize];if unsafe{GetDefaultPrinterW(name.as_mut_ptr(),&mut needed)}==0{return Err("Could not read the default printer.".into())}
  let mut printer:PrinterHandle=null_mut();if unsafe{OpenPrinterW(name.as_ptr(),&mut printer,null_mut())}==0{return Err("Could not open the default printer. Check POS80 Printer connection.".into())}
  let doc:Vec<u16>="NITRAM Sales Receipt\\0".encode_utf16().collect();let raw:Vec<u16>="RAW\\0".encode_utf16().collect();
  let info=DocInfo1W{pDocName:doc.as_ptr() as *mut u16,pOutputFile:null_mut(),pDatatype:raw.as_ptr() as *mut u16};
  let job=unsafe{StartDocPrinterW(printer,1,&info as *const _ as *const c_void)};if job==0{unsafe{ClosePrinter(printer)};return Err("Windows could not start the raw print job.".into())}
  let mut bytes=vec![0x1b,0x40];let safe:String=text.chars().map(|c|if c.is_ascii(){c}else{'?'}).collect();bytes.extend_from_slice(safe.as_bytes());bytes.extend_from_slice(&[10,10,10,10]);
  let mut written=0u32;let page=unsafe{StartPagePrinter(printer)}!=0;let ok=page&&unsafe{WritePrinter(printer,bytes.as_ptr() as *const c_void,bytes.len() as u32,&mut written)}!=0;
  if page{unsafe{EndPagePrinter(printer);}}unsafe{EndDocPrinter(printer);ClosePrinter(printer);}
  if !ok||written as usize!=bytes.len(){return Err("Printer did not accept the complete receipt. Check paper and connection.".into())}
  Ok(format!("Receipt sent directly to {}",String::from_utf16_lossy(&name).trim_end_matches('\\0')))
 }
 #[cfg(not(windows))] {let _=text;Err("Direct printing is supported in the Windows desktop app.".into())}
}
'@
          $pattern = '(?s)#\\[tauri::command\\]\\s*fn print_receipt\\(text:String\\)->Result<String,String>\\s*\\{.*?\\n\\}'
          if (-not [regex]::IsMatch($source,$pattern)) { throw "Could not locate existing print_receipt function for API correction." }
          $source = [regex]::Replace($source,$pattern,[System.Text.RegularExpressions.MatchEvaluator]{ param($m) $replacement },1)
          if ($source.Contains('OpenPrinterW,StartDocPrinterW') -or $source.Contains('windows_sys::Win32::Graphics::Printing::{ClosePrinter')) { throw "Old generated printer imports remain." }
          Set-Content -LiteralPath $mainPath -Value $source -NoNewline -Encoding utf8
          Write-Host "Replaced generated bindings with explicit Winspool ABI declarations."

      - name: Generate NITRAM Windows application icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $project = Join-Path $env:GITHUB_WORKSPACE "NITRAM_TAURI_SQLITE_PROJECT"
          $iconDir = Join-Path $project "src-tauri/icons"
          New-Item -ItemType Directory -Force -Path $iconDir | Out-Null
          $bitmap = New-Object System.Drawing.Bitmap 256,256
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $graphics.Clear([System.Drawing.Color]::FromArgb(18,24,22))
          $font = New-Object System.Drawing.Font("Arial",150,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(82,190,120))
          $graphics.DrawString("N",$font,$brush,30,25)
          $handle = $bitmap.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($handle)
          $stream = [System.IO.File]::Create((Join-Path $iconDir "icon.ico"))
          $icon.Save($stream)
          $stream.Dispose()
          $icon.Dispose()
          $graphics.Dispose()
          $bitmap.Dispose()
          if (-not (Test-Path (Join-Path $iconDir "icon.ico"))) { throw "Could not generate NITRAM icon." }

      - name: Build Windows installers
        shell: pwsh
        working-directory: NITRAM_TAURI_SQLITE_PROJECT/src-tauri
        run: cargo tauri build --bundles nsis

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: NITRAM-Windows-Installers
          path: |
            NITRAM_TAURI_SQLITE_PROJECT/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
