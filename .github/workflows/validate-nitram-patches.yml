name: Validate NITRAM build patches
on:
  push:
    branches: [build/stock-dispatch-and-pos-fixes, build/one-click-received-stock-dispatch]
    paths:
      - ".github/patches/**"
      - ".github/workflows/windows-build.yml"
      - ".github/workflows/validate-nitram-patches.yml"

permissions:
  contents: read

jobs:
  validate-patches:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4

      - name: Extract current Windows build kit
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "NITRAM_SUPERMARKET_GITHUB_WINDOWS_BUILD_KIT.zip"
          if (-not (Test-Path $archive)) { throw "Windows build kit ZIP is missing." }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:GITHUB_WORKSPACE -Force
          $project = Join-Path $env:GITHUB_WORKSPACE "NITRAM_TAURI_SQLITE_PROJECT"
          if (-not (Test-Path (Join-Path $project "dist/app.js"))) { throw "dist/app.js is missing." }

      - name: Apply existing source compatibility repairs
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE "NITRAM_TAURI_SQLITE_PROJECT"
          $htmlPath = Join-Path $project "dist/index.html"
          $html = Get-Content -LiteralPath $htmlPath -Raw
          $bad = '},\n      reset(){request(''DELETE'',''/state'');},'
          $good = "},`n      reset(){request('DELETE','/state');},"
          if ($html.Contains($bad)) { $html = $html.Replace($bad, $good) }
          Set-Content -LiteralPath $htmlPath -Value $html -NoNewline -Encoding utf8
          $configPath = Join-Path $project "src-tauri/tauri.conf.json"
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          if ($config.app.security) { $config.app.security.PSObject.Properties.Remove('csp') }
          $config | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $configPath -Encoding utf8

      - name: Apply POS feature and bug-fix patches
        shell: pwsh
        run: |
          .github/patches/apply-runtime-fixes.ps1
          .github/patches/apply-stock-dispatch-and-pos-fixes.ps1
          .github/patches/apply-dispatch-acknowledgement.ps1
          .github/patches/apply-offline-spreadsheets.ps1
          .github/patches/apply-dispatch-formats.ps1
          .github/patches/apply-received-stock-one-click-dispatch.ps1

      - name: Validate patched JavaScript and required features
        shell: pwsh
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE "NITRAM_TAURI_SQLITE_PROJECT/dist/app.js"
          node --check $app
          if ($LASTEXITCODE -ne 0) { throw "Patched JavaScript syntax validation failed." }
          $appContent = [System.IO.File]::ReadAllText($app)
          if ((Get-Item -LiteralPath $app).Length -lt 100000) { throw "Patched app.js is unexpectedly small or empty." }
          $required = @(
            "function dispatchNewlyReceivedStock()",
            "function _nitramReceivedMovements()",
            "source:'newly-received-stock'",
            "function createStockDispatch()",
            "function confirmStockDispatchReceipt()",
            "NITRAM-STOCK-ACK",
            "function searchHeldSales(value)",
            "function exportProductsBackup(format)",
            "function exportSalesBackup(format)",
            "function importPortableBackup(event,kind)",
            "variance=mpesaCounted+counted+expenses-netSales",
            "file.name.toLowerCase().endsWith('.xlsx')"
          )
          foreach ($marker in $required) {
            if (-not $appContent.Contains($marker)) { throw "Required feature marker missing: $marker" }
          }
          $html = Get-Content -LiteralPath (Join-Path (Split-Path $app -Parent) "index.html") -Raw
          if (-not $html.Contains("xlsx.full.min.js")) { throw "Offline Excel library is not wired into the app." }
          Write-Host "All patch application and JavaScript syntax checks passed. app.js bytes: $((Get-Item -LiteralPath $app).Length)"
