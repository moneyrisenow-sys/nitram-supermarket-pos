name: Keep latest NITRAM installer artifact
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  keep-latest-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the newest installer and remove only older copies
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          artifacts=$(gh api --paginate "repos/${REPOSITORY}/actions/artifacts" --jq '[.artifacts[] | select(.name == "NITRAM-Windows-Installers" and .expired == false)] | sort_by(.created_at) | reverse')
          count=$(jq 'length' <<< "$artifacts")
          echo "Found $count non-expired NITRAM installer artifact(s)."
          if [ "$count" -le 1 ]; then
            echo "Nothing to delete; the latest installer is preserved."
            exit 0
          fi
          jq -r '.[1:][] | [.id, .created_at] | @tsv' <<< "$artifacts" |
          while IFS=$'\t' read -r artifact_id created_at; do
            [ -n "$artifact_id" ] || continue
            echo "Deleting older installer artifact $artifact_id created at $created_at"
            gh api --method DELETE "repos/${REPOSITORY}/actions/artifacts/$artifact_id"
          done
